<!DOCTYPE html>
<html lang="ar" dir="rtl" style="color-scheme: light;"><head>
<meta charset="utf-8">

<title>تطبيق المدرسة الثانوية</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&amp;family=Amiri:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
:root{--bg:#eaf2fb;--surface:#fff;--ink:#12263f;--muted:#51657f;--line:#cfdcec;--brand:#1e4fa3;--brand-ink:#fff;--pencil:#f5b700;--trip:#e4572e;--ok:#2e9e4f;--bad:#b3261e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1424;--surface:#132038;--ink:#e7eefb;--muted:#9fb1cc;--line:#263a5c;--brand:#6ea2f0;--brand-ink:#08142a;--pencil:#f2c335;--trip:#ee8268;--ok:#5fd39a;--bad:#ff8a80}}
:root[data-theme="dark"]{--bg:#0b1424;--surface:#132038;--ink:#e7eefb;--muted:#9fb1cc;--line:#263a5c;--brand:#6ea2f0;--brand-ink:#08142a;--pencil:#f2c335;--trip:#ee8268;--ok:#5fd39a;--bad:#ff8a80}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Cairo",Tahoma,"Segoe UI",sans-serif;line-height:1.7}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 110px}
header{padding:22px 0 8px}
h1{margin:0;font-size:1.6rem;font-weight:800}
.sub{color:var(--muted);margin:0}
.bar{display:flex;gap:8px;align-items:center;margin:12px 0}
select,input,textarea{font:inherit;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);width:100%}
.bar select{width:auto}
.next{background:var(--brand);color:var(--brand-ink);border-radius:18px;padding:18px 20px;margin:8px 0 18px}
.next b{display:block;font-size:1.25rem}
.next .big{font-size:2.4rem;font-weight:800;line-height:1.1}
h2{font-size:1.1rem;margin:22px 0 8px}
.item{display:flex;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;align-items:center}
.item.past{opacity:.55}
.date{flex:0 0 58px;text-align:center;border-inline-end:3px solid var(--pencil);padding-inline-end:12px}
.date .d{font-size:1.6rem;font-weight:800;line-height:1}
.date .m{font-size:.8rem;color:var(--muted)}
.item h3{margin:0;font-size:1rem}
.grow{flex:1;min-width:0}
.meta{color:var(--muted);font-size:.85rem}
.chip{display:inline-block;font-size:.75rem;padding:1px 10px;border-radius:99px;background:var(--bg);border:1px solid var(--line);margin-inline-end:4px}
.chip.soon{background:var(--pencil);color:#2a2100;border-color:var(--pencil)}
.trip{background:var(--surface);border:1px solid var(--line);border-inline-start:6px solid var(--trip);border-radius:14px;padding:14px 16px;margin-bottom:10px}
.trip h3{margin:0 0 2px}
.trip label{display:flex;gap:8px;align-items:center;margin-top:10px;cursor:pointer}
.trip input{width:20px;height:20px;accent-color:var(--ok);padding:0}
.ann{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin-bottom:8px}
.ann h3{margin:0;font-size:1rem}.ann p{margin:4px 0 0;white-space:pre-line}
.empty{color:var(--muted);padding:20px;text-align:center}
.btn{font:inherit;font-weight:600;border:0;border-radius:10px;padding:8px 16px;background:var(--brand);color:var(--brand-ink);cursor:pointer}
.btn.alt{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.btn.del{background:none;color:var(--bad);border:1px solid var(--bad)}
.btn.sm{padding:3px 12px;font-size:.85rem}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.seg .btn{flex:1}
.form{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.form label{display:block;margin:8px 0 2px;font-size:.9rem;color:var(--muted)}
.row{display:flex;gap:8px;margin-top:12px}
.actions{display:flex;gap:6px;flex-direction:column}
.save{position:fixed;inset-inline:12px;bottom:calc(74px + env(safe-area-inset-bottom,0px));max-width:696px;margin:0 auto;background:var(--pencil);color:#2a2100;border-radius:14px;padding:10px 14px;display:flex;align-items:center;gap:10px;justify-content:space-between;box-shadow:0 4px 18px rgba(0,0,0,.25)}
.save .btn{background:#2a2100;color:#fff}
.note{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:10px 14px;color:var(--muted);font-size:.9rem}
nav{position:fixed;inset:auto 0 0 0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;gap:4px;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;max-width:120px;font:inherit;font-size:.75rem;font-weight:600;border:0;background:none;color:var(--muted);padding:8px 2px;border-radius:10px;cursor:pointer}
nav button[aria-selected="true"]{background:var(--brand);color:var(--brand-ink)}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--pencil);outline-offset:2px}
.bar{flex-wrap:wrap}
.hero{display:flex;gap:14px;align-items:center;margin:14px 0 4px;padding:14px 16px;border-radius:20px;color:#fff;background:linear-gradient(135deg,var(--h1),var(--h2));box-shadow:0 8px 24px rgba(30,79,163,.25)}
.hero h1{font-size:1.25rem;line-height:1.35}.hero p{margin:2px 0 0;opacity:.92;font-size:.85rem}
.logo{height:84px;width:auto;max-width:120px;object-fit:contain;background:#fff;border-radius:14px;padding:4px;flex:none}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{font:inherit;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:4px;padding:16px 8px;border-radius:16px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.tile span{font-size:1.8rem}
.pt{font-size:1.25rem;margin:14px 0 4px}
.item,.trip,.ann,.form{box-shadow:0 2px 10px rgba(20,50,100,.07)}
a{color:var(--brand)}
.clock{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:12px;padding:8px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:.85rem;color:var(--muted)}
.clock b{font-size:1.2rem;color:var(--ink);font-variant-numeric:tabular-nums;direction:ltr}
.calhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:8px 0}
.calhead h2{margin:0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{text-align:center;font-size:.75rem;color:var(--muted);font-weight:600}
.day{font:inherit;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:54px;padding:4px 1px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);cursor:pointer}
.day.we{opacity:.75}
.day.hol{background:#ffe58a;color:#2a2100;border-color:#e6c200;opacity:1}
.day.tdy{outline:2px solid var(--brand)}
.day.sel{box-shadow:0 0 0 3px var(--pencil)}
.dots{display:flex;gap:2px;flex-wrap:wrap;justify-content:center}
i.k-exam,.dots i,.legend i{display:inline-block;width:8px;height:8px;border-radius:50%}
i.k-exam{background:var(--brand)}i.k-trip{background:var(--trip)}i.k-event{background:var(--ok)}i.k-hw{background:#8e44ad}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin:10px 0}
.legend i{margin-inline-end:4px}
.item.k-exam{border-inline-start:5px solid var(--brand)}.item.k-trip{border-inline-start:5px solid var(--trip)}.item.k-event{border-inline-start:5px solid var(--ok)}.item.k-hw{border-inline-start:5px solid #8e44ad}
.fab{position:fixed;inset-inline-start:14px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:5;font:inherit;font-weight:700;border:0;border-radius:99px;padding:12px 18px;background:var(--pencil);color:#2a2100;box-shadow:0 4px 16px rgba(0,0,0,.3);cursor:pointer}
.fab.up{bottom:calc(140px + env(safe-area-inset-bottom,0px))}
.msg{background:rgba(179,38,30,.12);color:var(--bad);border:1px solid var(--bad);border-radius:10px;padding:8px 12px;margin:8px 0;font-weight:600}
.quote{display:block;width:100%;position:relative;margin:12px 0 0;padding:16px 20px 10px;border:2px solid var(--pencil);border-radius:18px;background:linear-gradient(135deg,rgba(245,183,0,.18),rgba(46,158,79,.12)),var(--surface);color:var(--ink);text-align:center;font:inherit;cursor:pointer;box-shadow:0 4px 14px rgba(20,50,100,.1)}
.quote::before{content:"\275D";position:absolute;inset-inline-start:12px;top:0;font-size:2rem;color:var(--pencil)}
.qt{font-family:"Amiri","Cairo",serif;font-size:1.3rem;line-height:1.9;white-space:pre-line;font-weight:700}
.qa{color:var(--muted);font-size:.9rem}
.qm{font-size:.7rem;color:var(--muted);margin-top:2px}
.year{margin:12px 0;padding:12px 16px;border-radius:16px;background:var(--surface);border:1px solid var(--line);box-shadow:0 2px 10px rgba(20,50,100,.07)}
.year b{display:block;font-size:1.05rem}
.bar2{height:12px;border-radius:99px;background:var(--line);overflow:hidden;margin:8px 0}
.bar2 i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--ok),var(--pencil))}
body::before{content:"";position:fixed;inset:-25%;z-index:-1;pointer-events:none;background:radial-gradient(40% 35% at 15% 20%,var(--g1),transparent 70%),radial-gradient(38% 34% at 85% 25%,var(--g2),transparent 70%),radial-gradient(45% 40% at 50% 90%,var(--g3),transparent 70%);animation:drift 22s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate3d(-2%,-1%,0) scale(1)}to{transform:translate3d(2%,2%,0) scale(1.08)}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
body.intro .item,body.intro .trip,body.intro .ann,body.intro .tile,body.intro .quote{animation:rise .5s both}
@media (prefers-reduced-motion:reduce){body::before{animation:none}body.intro *{animation:none!important}}
.item,.trip,.ann,.form,.year,.clock,.tile,.day{background:color-mix(in srgb,var(--surface) 84%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
h2{display:flex;align-items:center;gap:8px}
h2::before{content:"";width:5px;height:1.05em;border-radius:3px;background:linear-gradient(var(--pencil),var(--brand));flex:none}
.hero{position:relative;overflow:hidden;padding:18px}
.hero::after{content:"";position:absolute;inset-inline-end:-30px;top:-50px;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.13)}
.hero>*{position:relative;z-index:1}
.gr{display:block;font-size:.85rem;opacity:.92}
.tile{transition:transform .15s}.tile:active{transform:scale(.96)}
nav{inset:auto 10px calc(10px + env(safe-area-inset-bottom,0px)) 10px;max-width:680px;margin-inline:auto;border:1px solid var(--line);border-radius:22px;padding:6px;box-shadow:0 8px 28px rgba(0,0,0,.2);background:color-mix(in srgb,var(--surface) 88%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.fab{bottom:calc(92px + env(safe-area-inset-bottom,0px))}.fab.up{bottom:calc(156px + env(safe-area-inset-bottom,0px))}
.save{bottom:calc(88px + env(safe-area-inset-bottom,0px))}
.lbl{margin:12px 0 4px;font-size:.9rem;color:var(--muted)}
.swatches{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:8px}
.sw{font:inherit;font-weight:700;color:#fff;border:3px solid transparent;border-radius:14px;padding:14px 6px;cursor:pointer;text-shadow:0 1px 3px rgba(0,0,0,.45)}
.sw.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--pencil)}
.tg{display:grid;grid-template-columns:repeat(2,1fr);gap:2px}
.form label.chk{display:flex;align-items:center;gap:8px;margin:2px 0;color:var(--ink);font-size:.95rem}
.chk input{width:20px;height:20px;padding:0;accent-color:var(--brand)}
</style>
